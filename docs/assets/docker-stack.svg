    <circle cx="28" cy="324" r="6" fill="#2f8f83"/><text x="48" y="329">ingestion-service-1</text><text x="440" y="329">incident-platform-ingestion-service</text><text x="845" y="329">8081:8080</text><text x="1060" y="329">running</text>
    <circle cx="28" cy="360" r="6" fill="#2f8f83"/><text x="48" y="365">event-processor-service-1</text><text x="440" y="365">incident-platform-event-processor-service</text><text x="845" y="365">internal</text><text x="1060" y="365">running</text>
