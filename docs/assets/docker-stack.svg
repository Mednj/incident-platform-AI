  <text x="845" y="76" fill="#68758a" font-family="Inter,Segoe UI,Arial" font-size="11" font-weight="700">Ports</text>
  <text x="1060" y="76" fill="#68758a" font-family="Inter,Segoe UI,Arial" font-size="11" font-weight="700">Status</text>
