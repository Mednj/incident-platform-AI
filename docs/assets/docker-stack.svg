    <circle cx="28" cy="144" r="6" fill="#2f8f83"/><text x="48" y="149">postgres-1</text><text x="440" y="149">postgres:16-alpine</text><text x="845" y="149">5432:5432</text><text x="1060" y="149">healthy</text>
    <circle cx="28" cy="180" r="6" fill="#2f8f83"/><text x="48" y="185">kafka-1</text><text x="440" y="185">confluentinc/cp-kafka:7.6.1</text><text x="845" y="185">9092:9092</text><text x="1060" y="185">healthy</text>
    <circle cx="28" cy="216" r="6" fill="#2f8f83"/><text x="48" y="221">schema-registry-1</text><text x="440" y="221">confluentinc/cp-schema-registry:7.6.1</text><text x="845" y="221">8088:8081</text><text x="1060" y="221">running</text>
