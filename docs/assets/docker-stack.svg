<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Docker Compose local stack</title>
  <desc id="desc">Docker Desktop style list of the local incident platform containers running with exposed ports.</desc>
  <rect width="1400" height="520" fill="#ffffff"/>
  <rect x="0" y="0" width="1400" height="42" fill="#f7f9fc" stroke="#e1e6ef"/>
  <text x="48" y="27" fill="#17233a" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="800">incident-platform</text>
  <text x="1210" y="27" fill="#68758a" font-family="Inter,Segoe UI,Arial" font-size="12">local Docker Compose stack</text>
