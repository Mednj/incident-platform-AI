services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incident_platform}
      POSTGRES_USER: ${POSTGRES_USER:-incident}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incident}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incident} -d ${POSTGRES_DB:-incident_platform}"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    depends_on:
      - kafka
    ports:
      - "8088:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    env_file: .env
    ports:
      - "${AUTH_PORT:-8086}:8080"

  ingestion-service:
    build:
      context: ./backend
      dockerfile: ingestion-service/Dockerfile
    env_file: .env
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "${INGESTION_PORT:-8081}:8080"

  event-processor-service:
    build:
      context: ./backend
      dockerfile: event-processor-service/Dockerfile
    env_file: .env
    depends_on:
      - kafka
      - schema-registry

  incident-service:
    build:
      context: ./backend
      dockerfile: incident-service/Dockerfile
    env_file: .env
    depends_on:
      - postgres
      - kafka
      - schema-registry
    ports:
      - "${INCIDENT_PORT:-8083}:8080"

  ai-analysis-service:
    build:
      context: ./backend
      dockerfile: ai-analysis-service/Dockerfile
    env_file: .env
    depends_on:
      - postgres
      - kafka
      - schema-registry
    ports:
      - "${AI_ANALYSIS_PORT:-8084}:8080"

  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    env_file: .env
    depends_on:
      - kafka
      - schema-registry

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - auth-service
      - incident-service
      - ai-analysis-service

volumes:
  postgres-data:

