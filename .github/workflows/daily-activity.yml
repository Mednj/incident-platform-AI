name: Daily activity

on:
  schedule:
    - cron: "55 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily activity log
        run: |
          mkdir -p docs
          echo "- $(date -u '+%Y-%m-%d %H:%M UTC') automated repository activity" >> docs/daily-activity.md

      - name: Commit and push
        run: |
          git config user.name "Mednj"
          git config user.email "69809265+Mednj@users.noreply.github.com"
          git add docs/daily-activity.md
          git commit -m "Daily activity update"
          git push
