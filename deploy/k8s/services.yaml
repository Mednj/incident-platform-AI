apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: incident-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: mednj/incident-platform-auth-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: incident-platform-config
            - secretRef:
                name: incident-platform-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
---
