server:
  port: 8080

spring:
  application:
    name: ai-analysis-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:incident_platform}
    username: ${POSTGRES_USER:incident}
    password: ${POSTGRES_PASSWORD:incident}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8088}
        specific.avro.reader: true
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8088}

incident:
  ai:
    provider: ${AI_PROVIDER:local}
    model: ${AI_MODEL:local-investigation-summary-v1}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-to-a-long-random-secret-for-dev-only}
      issuer: ${JWT_ISSUER:incident-platform}
      ttl-minutes: 240

management:
  endpoints:
    web:
      exposure:
        include: health,info

